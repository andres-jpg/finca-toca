# Aplica las migraciones de supabase/migrations/ al entorno que corresponde a la rama:
#   develop → staging (automático)
#   main    → producción (tras la aprobación manual del entorno `Production`)
# Las migraciones deben ser SIEMPRE compatibles hacia atrás (expand → migrate → contract):
# el código antiguo sigue sirviendo tráfico mientras se aplican. Ver CLAUDE.md → Deployment.
name: Migraciones

on:
  push:
    branches: [develop, main]
    paths:
      - supabase/migrations/**
      - .github/workflows/migrate.yml
      - .github/scripts/verificar-baseline.mjs
  workflow_dispatch:

permissions:
  contents: read

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

jobs:
  staging:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Nunca se cancela una migración a medias.
    concurrency:
      group: migrar-staging
      cancel-in-progress: false
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile

      # Staging = project-ref wiquvwviaawvpjkthdam (secret STAGING_PROJECT_REF).
      - name: Enlazar con staging
        env:
          PROJECT_REF: ${{ secrets.STAGING_PROJECT_REF }}
        run: pnpm exec supabase link --project-ref "$PROJECT_REF"

      - name: Migraciones pendientes
        run: pnpm exec supabase db push --dry-run

      - name: Aplicar migraciones
        run: pnpm exec supabase db push

  production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Producción exige aprobación manual: se configura en Settings → Environments → Production.
    environment: Production
    concurrency:
      group: migrar-produccion
      cancel-in-progress: false
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile

      # Producción = project-ref tqaprzgccgoiiqxzincv (secret PROD_PROJECT_REF).
      - name: Enlazar con producción
        env:
          PROJECT_REF: ${{ secrets.PROD_PROJECT_REF }}
        run: pnpm exec supabase link --project-ref "$PROJECT_REF"

      # En producción el esquema de la baseline ya existe, pero su historial de migraciones no la
      # conoce hasta que alguien ejecuta, una vez y a mano, `supabase migration repair --status
      # applied 20261019000000`. Si sigue pendiente, este paso aborta en vez de reaplicarla.
      - name: Guarda — la baseline no puede figurar como pendiente
        shell: bash # con pipefail: si `migration list` falla, el paso falla
        run: pnpm exec supabase migration list --linked --output-format json | node .github/scripts/verificar-baseline.mjs

      - name: Migraciones pendientes
        run: pnpm exec supabase db push --dry-run

      - name: Aplicar migraciones
        run: pnpm exec supabase db push
